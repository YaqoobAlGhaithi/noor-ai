name: Build Noor AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Flutter project
        run: |
          flutter create --platforms=android --project-name noor_ai temp_app
          cp pubspec.yaml temp_app/pubspec.yaml
          cp lib/main.dart temp_app/lib/main.dart

      - name: Build release APK
        working-directory: temp_app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define="GEMINI_API_KEY=${GEMINI_API_KEY}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-ai-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
